<!DOCTYPE html>
<html lang="en" class="scroll-smooth dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fixit — Report the bug once. Watch it get fixed. Get paid for the fix.</title>
    <meta name="description" content="Fixit gathers what people report about the apps they use, shows companies what matters most, and rewards the people who help fix it." />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔧</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', 'system-ui', '-apple-system', 'sans-serif'],
              mono: ['"JetBrains Mono"', 'ui-monospace', 'monospace'],
            },
            colors: {
              brand: {
                DEFAULT: '#a5b4fc',
                strong: '#4f46e5',
                soft: '#1e1b4b',
                hover: '#818cf8',
              },
              surface: {
                DEFAULT: '#111827',
                muted: '#1f2937',

              canvas: '#0b1120',
              border: '#334155',

                faint: '#64748b',

              ok: {

                soft: '#052e22',
                strong: '#10b981',

                soft: '#2d1f04',
                strong: '#f59e0b',
              },
              danger: {
                DEFAULT: '#f87171',
                soft: '#2d0a0a',
                strong: '#ef4444',
              },
              info: {
                DEFAULT: '#38bdf8',
                soft: '#082236',
                strong: '#0ea5e9',
              },
            },
            boxShadow: {
              card: '0 4px 6px -1px rgba(0, 0, 0, 0.4), 0 2px 4px -2px rgba(0, 0, 0, 0.4)',

  <body class="bg-[#0b1120] text-[#f1f5f9] antialiased selection:bg-indigo-900 selection:text-indigo-200">
    <div id="root"></div>
    <script type="module" src="./src/main.jsx"></script>
